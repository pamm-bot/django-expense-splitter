{% extends "frontend/base.html" %}
{% block title %}Reset password · Split Expenses{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-3">Reset your password</h4>
      <form id="reset-request-form">
        <div class="mb-2">
          <input type="email" class="form-control" name="email" placeholder="Email" required>
        </div>
        <div id="reset-message" class="small mb-2"></div>
        <button type="submit" class="btn btn-money w-100">Send reset link</button>
      </form>
      <p class="text-center mt-3 mb-0"><a href="/" class="link-money small">Back to log in</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("reset-request-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const messageBox = document.getElementById("reset-message");
    try {
      const { detail } = await Api.requestPasswordReset(form.get("email"));
      messageBox.className = "small mb-2 balance-positive";
      messageBox.textContent = detail;
      e.target.reset();
    } catch (err) {
      messageBox.className = "small mb-2 text-danger";
      messageBox.textContent = err.message;
    }
  });
</script>
{% endblock %}
