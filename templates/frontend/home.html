{% extends "frontend/base.html" %}
{% block title %}Split Expenses{% endblock %}
{% block content %}
<div class="row justify-content-center g-4">
  <div class="col-md-5 d-flex flex-column">
    <p class="text-muted mb-2 text-center">Already have an account?</p>
    <div class="card p-4 flex-fill d-flex flex-column">
      <h4 class="mb-3">Log in</h4>
      <form id="login-form" class="d-flex flex-column flex-fill">
        <div class="mb-2">
          <input type="text" class="form-control" name="username" placeholder="Username" required>
        </div>
        <div class="mb-2">
          <input type="password" class="form-control" name="password" placeholder="Password" required>
        </div>
        <div id="login-error" class="text-danger small mb-2"></div>
        <button type="submit" class="btn btn-money w-100 mt-auto">Log in</button>
        <p class="text-center mt-2 mb-0"><a href="/reset-password/" class="link-money small">Forgot password?</a></p>
      </form>
    </div>
  </div>

  <div class="col-md-5 d-flex flex-column">
    <p class="text-muted mb-2 text-center">New here?</p>
    <div class="card p-4 flex-fill d-flex flex-column">
      <h4 class="mb-3">Sign up</h4>
      <form id="register-form" class="d-flex flex-column flex-fill">
        <div class="mb-2">
          <input type="text" class="form-control" name="username" placeholder="Username" required>
        </div>
        <div class="mb-2">
          <input type="email" class="form-control" name="email" placeholder="Email">
        </div>
        <div class="mb-2">
          <input type="password" class="form-control" name="password" placeholder="Password (min. 8 characters)" required minlength="8">
        </div>
        <div id="register-error" class="text-danger small mb-2"></div>
        <button type="submit" class="btn btn-money w-100 mt-auto">Create account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (Api.token()) window.location.href = "/groups/";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const errorBox = document.getElementById("login-error");
    errorBox.textContent = "";
    try {
      const { token } = await Api.login(form.get("username"), form.get("password"));
      Api.setToken(token);
      Api.setCurrentUsername(form.get("username"));
      window.location.href = "/groups/";
    } catch (err) {
      errorBox.textContent = "Wrong username or password.";
    }
  });

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const errorBox = document.getElementById("register-error");
    errorBox.textContent = "";
    try {
      await Api.register(form.get("username"), form.get("email"), form.get("password"));
      const { token } = await Api.login(form.get("username"), form.get("password"));
      Api.setToken(token);
      Api.setCurrentUsername(form.get("username"));
      window.location.href = "/groups/";
    } catch (err) {
      errorBox.textContent = err.message;
    }
  });
</script>
{% endblock %}
