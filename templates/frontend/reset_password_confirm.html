{% extends "frontend/base.html" %}
{% block title %}Set a new password · Split Expenses{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-3">Set a new password</h4>
      <form id="reset-confirm-form">
        <div class="mb-2">
          <input type="password" class="form-control" name="password" placeholder="New password (min. 8 characters)" required minlength="8">
        </div>
        <div id="reset-confirm-message" class="small mb-2"></div>
        <button type="submit" class="btn btn-money w-100">Set new password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const uid = "{{ uid }}";
  const token = "{{ token }}";

  document.getElementById("reset-confirm-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const messageBox = document.getElementById("reset-confirm-message");
    try {
      await Api.confirmPasswordReset(uid, token, form.get("password"));
      messageBox.className = "small mb-2 balance-positive";
      messageBox.textContent = "Password updated — you can now log in.";
      e.target.reset();
      setTimeout(() => { window.location.href = "/"; }, 1500);
    } catch (err) {
      messageBox.className = "small mb-2 text-danger";
      messageBox.textContent = err.message;
    }
  });
</script>
{% endblock %}
