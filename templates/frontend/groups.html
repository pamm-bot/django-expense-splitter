{% extends "frontend/base.html" %}
{% block title %}Your groups · Split Expenses{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Your groups</h2>
</div>

<form id="create-group-form" class="d-flex gap-2 mb-4" style="max-width: 400px;">
  <input type="text" class="form-control" name="name" placeholder="New group name" required>
  <button type="submit" class="btn btn-money text-nowrap">Create</button>
</form>

<div id="groups-list"></div>
{% endblock %}

{% block scripts %}
<script>
  if (!Api.token()) window.location.href = "/";

  async function loadGroups() {
    const groups = await Api.listGroups();
    const list = document.getElementById("groups-list");

    if (groups.length === 0) {
      list.innerHTML = `<p class="text-muted">No groups yet — create one above.</p>`;
      return;
    }

    list.innerHTML = groups.map((group) => `
      <a href="/groups/${group.id}/" class="group-row">
        <span class="fw-bold">${escapeHtml(group.name)}</span>
        <span class="text-muted mono small">${group.members.length} member${group.members.length === 1 ? "" : "s"}</span>
      </a>
    `).join("");
  }

  document.getElementById("create-group-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    await Api.createGroup(form.get("name"));
    e.target.reset();
    loadGroups();
  });

  loadGroups();
</script>
{% endblock %}
